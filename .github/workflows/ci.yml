name: Phoenix Test Automation workflow 

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# ADD THIS BLOCK TO FIX THE 403 ERROR
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Executing Test Automation framework
      run: mvn clean test -DsuiteXmlFile=testng.xml -Denv=qa

    # This will now succeed without the 403 error
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
